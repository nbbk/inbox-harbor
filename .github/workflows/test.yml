name: Tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit and HTTP regression tests
        run: npm test
      - name: Install Chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        if: ${{ !cancelled() }}
        run: npx playwright test
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
